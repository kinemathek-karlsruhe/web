title: Textseite
icon: text

description: Einfache Inhaltsseite — Einleitung, Fließtext (Kirbytext), optionales Bild.

options:
  template:
    - collection
    - custom

status:
  draft: Entwurf
  unlisted: Versteckt (nur per Link erreichbar)
  listed: Im Seitenmenü (Pivot-Navigation)

sections:
  content:
    type: fields
    fields:
      intro:
        label: Einleitung
        type: textarea
        size: small
        help: Optionaler Vorspann — wird größer gesetzt.
      text:
        label: Text
        type: textarea
        size: huge
      cover:
        label: Kartenbild
        type: files
        multiple: false
        translate: false
        query: page.images
        uploads:
          template: bild
        help: >-
          Optional: das Bild, mit dem diese Seite auf der Bereichsseite als
          Karte erscheint. Leer lassen = automatisch das erste Bild mit der
          Darstellung „Groß“.
      mainimage:
        label: Bild
        type: files
        multiple: false
        uploads: true

  subpages:
    type: pages
    label: Unterseiten
